name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - content/**
      - quartz_repo
      - src/**
      - grammar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # the time zone of the dates Quartz writes on the pages
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
          submodules: true

      # The compiler, for the documentation that is to be generated from its
      # source. It is not a submodule: build.js finds it in cesium-src/.
      - uses: actions/checkout@v7
        with:
          repository: cesiumlang/cesium
          ref: main
          path: cesium-src

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: |
          npm install
          npm run install-deps

      - name: Build Quartz
        run: npm run build:ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: quartz_repo/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
