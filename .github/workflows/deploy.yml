name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - content/**
      - site/**
      - tools/**
      - build.zig
      - build.zig.zon
      - grammar
  # a push to main of cesiumlang/cesium starts it, for its specification
  # (its site.yml; cesiumlang/cesium#106)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The Zig that builds the site, set by hand. When the Zig of the Cesium devkit
# changes, change it here, in build.zig.zon and in the workflow of
# cesiumlang/cesiumlang.dev (see CLAUDE.md of cesium-workspace).
env:
  ZIG_VERSION: 0.17.1

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # the time zone of the dates on the pages
      TZ: America/Chicago
    outputs:
      cesium: ${{ steps.cesium.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the page dates come from git history
          submodules: true

      - uses: randyos-org/setup-zig@node24 # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      # Zine is built from source: keep what Zig built
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'grammar/build.zig.zon') }}

      # the specification and the proposals: Skein's rendering of cesiumlang/cesium,
      # with its tags for the editions of its releases
      - uses: actions/checkout@v7
        with:
          repository: cesiumlang/cesium
          ref: main
          path: cesium-src
          fetch-depth: 0

      # the commit of cesium that is built, which the mirror builds too
      - name: Note the commit of cesium
        id: cesium
        run: echo "sha=$(git -C cesium-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # the root is the latest release (cesiumlang.org#43); main while there is none
      - name: The specification, from the latest release of cesium
        run: |
          latest=$(git -C cesium-src tag --list 'v[0-9]*' --sort=-version:refname | head -1)
          if [ -n "$latest" ]; then git -C cesium-src checkout -q "$latest"; fi
          echo "the root is ${latest:-main}"
          bash tools/take-spec.sh cesium-src

      # an edition of each release, under /vX.Y.Z/
      - name: The editions of the releases
        run: bash tools/take-editions.sh cesium-src

      - name: Build the site
        run: zig build

      # llms.txt, a Markdown version of each page and the Cesium skill
      # (cesiumlang/cesiumlang.org#25), written beside the pages; strict: a rule
      # that names no source, or a link to no page, fails the deploy
      - name: Files for AI models
        run: zig-out/bin/cesium-site-ai --out zig-out/public --host cesiumlang.org --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The mirror is another repository's Pages site, under another domain
  # (cesium.randyeckman.com), which builds this repository itself. A commit
  # there starts its build and records what it built: this commit, and the
  # commit of cesium the specification came from. It is made with a deploy key
  # that can write to that repository and nothing else (the secret
  # SITE_MIRROR_DEPLOY_KEY; MIRROR_DEPLOY_KEY is the development site's).
  mirror:
    name: Start the mirror's build
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: emanspeaks/cesium-site-mirror
          ssh-key: ${{ secrets.SITE_MIRROR_DEPLOY_KEY }}

      - name: Record the commits to build
        env:
          CESIUM_SHA: ${{ needs.build.outputs.cesium }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n%s\n' "$GITHUB_SHA" "$CESIUM_SHA" > source.txt
          git add source.txt
          if git diff --cached --quiet; then
            echo "The mirror already has these commits."
            exit 0
          fi
          git commit -q -m "Build cesiumlang.org@${GITHUB_SHA::7}, cesium@${CESIUM_SHA::7}"
          git push -q
