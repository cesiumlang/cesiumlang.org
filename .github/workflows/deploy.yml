name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - content/**
      - site/**
      - tools/**
      - build.zig
      - build.zig.zon
      - grammar
  # a push to main of cesiumlang/cesium starts it, for its specification
  # (its site.yml; cesiumlang/cesium#106)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The Zig that builds the site, set by hand. When the Zig of the Cesium devkit
# changes, change it here, in build.zig.zon and in the workflow of
# cesiumlang/cesiumlang.dev (see CLAUDE.md of cesium-workspace).
env:
  ZIG_VERSION: 0.17.1

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # the time zone of the dates on the pages
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the page dates come from git history
          submodules: true

      - uses: randyos-org/setup-zig@node24 # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      # Zine is built from source: keep what Zig built
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'grammar/build.zig.zon') }}

      # the specification and the proposals: Skein's rendering of cesiumlang/cesium
      - uses: actions/checkout@v7
        with:
          repository: cesiumlang/cesium
          ref: main
          path: cesium-src

      - name: The specification, from cesium
        run: bash tools/take-spec.sh cesium-src

      - name: Build the site
        run: zig build

      # llms.txt, a Markdown version of each page and the Cesium skill
      # (cesiumlang/cesiumlang.org#25), written beside the pages
      - name: Files for AI models
        run: zig-out/bin/cesium-site-ai --out zig-out/public --host cesiumlang.org

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
