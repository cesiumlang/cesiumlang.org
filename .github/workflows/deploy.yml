name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - content/**
      - site/**
      - tools/**
      - build.zig
      - build.zig.zon
      - grammar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # the time zone of the dates on the pages
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the page dates come from git history
          submodules: true

      # The compiler, for the documentation that is to be generated from its
      # source, and for the devkit with the Zig that builds the site.
      - uses: actions/checkout@v7
        with:
          repository: cesiumlang/cesium
          ref: main
          path: cesium-src

      - name: Fetch the devkit
        run: bash cesium-src/tools/fetch-devkit.sh

      # Zine is built from source: keep what Zig built
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'grammar/build.zig.zon') }}

      - name: Build the site
        run: cesium-src/.devkit/zig/zig build

      # llms.txt, a Markdown version of each page and the Cesium skill
      # (cesiumlang/cesiumlang.org#25), written beside the pages
      - name: Files for AI models
        run: zig-out/bin/cesium-site-ai --out zig-out/public --host cesiumlang.org

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
